# =============================================================================
# BioIntel Agent — full local stack.
#
#   Base stack:   docker compose up -d
#   With obs:     docker compose --profile observability up -d
#
# Ollama runs on the HOST (install from https://ollama.com). Containers reach it
# via host.docker.internal (mapped below for Linux). Pull models first:
#   ollama pull qwen2.5:14b-instruct
# =============================================================================

x-common-env: &common-env
  env_file:
    - .env
  extra_hosts:
    - "host.docker.internal:host-gateway"

# API/UI use host networking so they can reach Ollama on localhost:11434 (common on
# Linux and Docker-in-Docker). Backing services stay on the compose network with
# published ports on localhost.
x-host-local-env: &host-local-env
  POSTGRES_HOST: localhost
  REDIS_URL: redis://localhost:6379/0
  MINIO_ENDPOINT: localhost:9000
  QDRANT_URL: http://localhost:6333
  OPENSEARCH_URL: https://localhost:9200
  OLLAMA_BASE_URL: http://localhost:11434

services:
  # ------------------------------------------------------------------ Postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biointel}
      POSTGRES_USER: ${POSTGRES_USER:-biointel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biointel}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biointel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------------- MinIO
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------- Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- OpenSearch
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Bi0nt3l!Os9xp}"
      # Dev: avoid read-only lock when host disk is tight (flood-stage watermark).
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:${OPENSEARCH_PASSWORD:-Bi0nt3l!Os9xp} https://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  # ------------------------------------------------------------------- Milvus (optional dense backend; profile: milvus)
  milvus:
    image: milvusdb/milvus:v2.4.6
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
    volumes:
      - milvusdata:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5

  # ----------------------------------------------------------------------- API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *common-env
    network_mode: host
    environment:
      <<: *host-local-env
      EMBEDDING_DEVICE: cpu
      RERANKER_DEVICE: cpu
    command: ["uvicorn", "biointel.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    volumes:
      - hf_cache:/root/.cache/huggingface

  # ------------------------------------------------------------------------ UI
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *common-env
    network_mode: host
    command: ["streamlit", "run", "biointel/ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      BIOINTEL_API_URL: http://localhost:8000
    depends_on:
      - api

  # =========================================================================
  # OBSERVABILITY (opt-in): docker compose --profile observability up -d
  # =========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.57
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # Langfuse (LLM tracing) + its own Postgres.
  langfuse-db:
    image: postgres:16-alpine
    profiles: ["observability"]
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
    volumes:
      - langfusedb:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["observability"]
    depends_on:
      - langfuse-db
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-langfuse-secret
      SALT: change-me-langfuse-salt
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  miniodata:
  qdrantdata:
  opensearchdata:
  milvusdata:
  hf_cache:
  langfusedb:
