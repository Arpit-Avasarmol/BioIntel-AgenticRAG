[project]
name = "biointel-agent"
version = "0.1.0"
description = "BioIntel Agent — Agentic RAG for Drug Discovery & Patent Intelligence (fully local, open-weights)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arpit Avasarmol" }]

dependencies = [
    # --- Core / config ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.3",
    "httpx>=0.27",
    "orjson>=3.10",

    # --- API ---
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",

    # --- Data / DB ---
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "redis>=5.0",
    "minio>=7.2",

    # --- Vector / search ---
    "qdrant-client>=1.9",
    "opensearch-py>=2.6",

    # --- ML / embeddings / rerank ---
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2",
    "torch>=2.2",
    "numpy>=1.26",
    "tiktoken>=0.7",

    # --- Agent / LLM ---
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "ollama>=0.3",

    # --- Observability ---
    "langfuse>=2.39",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "prometheus-client>=0.20",

    # --- UI ---
    "streamlit>=1.36",
]

[project.optional-dependencies]
milvus = ["pymilvus>=2.4"]
gcp = ["google-cloud-bigquery>=3.25", "db-dtypes>=1.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
]

[project.scripts]
biointel = "biointel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biointel"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions", ".venv-verify", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["biointel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require running services (deselect with -m 'not integration')",
]
asyncio_mode = "auto"
